name: Release APK

on:
  push:
    tags: ['v*']          # v1.2.0 -> publica la versión 1.2.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 1.2.0)'
        required: true

permissions:
  contents: write         # necesario para crear el release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Determinar versión
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # versionCode debe crecer siempre; el número de ejecución sirve y nunca repite
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Publicando v$VERSION (versionCode $GITHUB_RUN_NUMBER)"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar CSS, validar y sincronizar
        run: npm run sync

      - name: Restaurar el keystore desde los secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Sin él el APK no se puede firmar."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Construir APK firmado
        working-directory: android
        env:
          MATHPAD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MATHPAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MATHPAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="${{ steps.v.outputs.version }}" \
            -PappVersionCode="${{ steps.v.outputs.code }}"

      - name: Renombrar el APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/MathPad-v${{ steps.v.outputs.version }}.apk"
          ls -lh dist/

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
          APK: dist/MathPad-v${{ steps.v.outputs.version }}.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "MathPad $TAG" \
              --generate-notes
          fi

      - name: Borrar el keystore del runner
        if: always()
        run: rm -f android/app/release.keystore
