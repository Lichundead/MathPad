name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # crear el Release y subirle el APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Capacitor 8 necesita JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar CSS y sincronizar Capacitor
        run: npm run sync

      - name: Construir APK de debug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Release fijo «latest»: siempre el mismo enlace de descarga, siempre el APK
      # de la ultima build. Se borra y se recrea para que el tag, las notas y el
      # commit no se desincronicen. gh ya viene instalado en el runner.
      - name: Publicar el APK como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MathPad.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MathPad.apk \
            --title "MathPad — última versión" \
            --notes "Build automática del commit ${{ github.sha }}"
